name: Release

on:
  push:
    tags:
      - "v*.*.*"

# 🔴 三个 job 的分工（2026-10-22 重构）
# --------------------------------------------------------------
# 原来的写法有两个真 bug：
#   ① `github-release` job 直接贴 `dist/*.whl`，但 dist/ 是**另一个 job** 的产物
#      —— 它自己从不 build ⇒ workflow **一个附件都没贴上**。
#      而 `fail_on_unmatched_files` 默认是 false ⇒ 匹配不到文件也**静默成功**，
#      看起来"发布页建好了"，实际 wheel 一直缺着（v0.1.0 页面上那两个文件
#      —— tarball 和 RELEASE-v0.1.0.md —— 是**手工**传上去的，不是 workflow 的产物）。
#   ② PyPI 用 OIDC 信任发布，而项目没在 PyPI 侧注册 ⇒ 必挂，
#      于是整个 Release workflow 常驻一个红叉。
#
# 改成：build 一次 → 产物走 artifact → 两个下游 job 各自消费。
#   build         打包 + twine check + 上传 artifact
#   publish-pypi  没配 PYPI_API_TOKEN 就 **跳过**（并在日志里明确告警，而不是假装成功）
#   github-release 贴上 wheel + sdist（这次真有附件了）
#                 fail_on_unmatched_files: true ⇒ 匹配不到就失败，不再静默
jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    # 没配 token 就不发。skipped ≠ 失败，Release workflow 不再常驻红叉。
    #
    # 🔴🔴 但**不能**写成 job 级的 `if: ${{ secrets.PYPI_API_TOKEN != '' }}`：
    # GitHub 的上下文可用性表里，`jobs.<job_id>.if` 只允许
    # github / needs / vars / inputs —— **没有 secrets**。
    # 用了 secrets，GitHub 会把**整个 workflow 文件判为非法**：
    #   · workflow 名字退化成文件路径（列表里显示成 ".github/workflows/release.yml"）
    #   · 每一次 push 都会创建一个 0 秒失败的 run，提示 "workflow file issue"
    # 而 secrets 在 **steps.*.env** 里是允许的 ⇒ 先在步骤里算出布尔值，
    # 再用步骤级 if 判断。
    steps:
      - name: Check PyPI token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::没有配置 PYPI_API_TOKEN —— 跳过 PyPI 发布（这是跳过，不是失败）"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        if: steps.token.outputs.available == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
