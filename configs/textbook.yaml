# 教辅资料（人教版/北师大版/苏教版等）格式 PDF 题库解析配置
#
# 教辅资料典型排版:
#   - 页眉: "第X章 名称" 或 "X.X 名称" 形式（无固定格式）
#   - 题目: "1．题干..." / "例1..." / "1.1..."
#   - 选项: "A．..." 独占行
#   - 经常没有"专题XX / N"格式
#   - 经常有"考点"/"例题"/"练习"等章节标签
#
# 比通用配置更宽松，能识别多种题号格式

name: 教辅资料
description: 人教版/北师大版/苏教版等教辅资料 PDF 解析配置

# 题目识别：兼容多种格式
#  - "1．题干"
#  - "1、题干"
#  - "例1：题干"
#  - "1.1 题干"
#  - "第1题 题干"
question_pattern: '^(?:例)?(\d+(?:\.\d+)?)\s*[．\.、：:]\s*(.{10,})'
option_pattern: '^([A-D])[．\.]\s*(.*)$'

# 教辅资料通常无标准页眉
header_pattern: ''
has_question_pattern: '^\s*(?:例)?\d+(?:\.\d+)?\s*[．\.、：:]'
topic_title_pattern: ''

option_keys: [A, B, C, D]
essay_keywords:
  - 求
  - 证明
  - 试求
  - 试证明
  - 计算
  - 解答
  - "解:"
  - "解："
  - （1）
  - (1)
  - ①
  - ②
  - ③

# 教辅资料常见跳过词
skip_patterns:
  - '人教\s*版'
  - '北师\s*大\s*版'
  - '苏教\s*版'
  - '沪教\s*版'
  - '考点'
  - '命题趋势'
  - '五年考情'
  - '本节知识'
  - '知识网络'

skip_exact_lines:
  - 考点
  - 命题趋势
  - 五年考情
  - 知识网络
  - 本节知识梳理
