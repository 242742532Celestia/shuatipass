# 学科网格式 PDF 题库解析配置
# 适用：学科网（xueke100）"五年真题/三年真题/专题汇编"系列 PDF
#
# PDF 排版特征:
#   - 页眉: "专题01 直线运动\n1 / 20\n学科网（北京）股份有限公司"
#   - 题目: "1．（2025·黑吉辽蒙卷·高考真题）题干..."
#   - 选项: "A．..." / "B．..."（独占行，或紧跟题干）
#   - 考点分析页: 整页无题号

name: 学科网
description: 学科网"五年真题/三年真题/专题汇编"系列 PDF 解析配置

# 必填：4 个核心正则
header_pattern: '专题\s*(\d+)\s+(\S+?)\s*\n\s*(\d+)\s*/\s*(\d+)\s*\n'
question_pattern: '^(\d+)\s*[．\.]\s*[（(]\s*(\d{4})\s*[·\.]\s*([^·）\)]+?)\s*[·\.]\s*(?:高考真题|高考|真题|模拟)?\s*[）)]\s*'
option_pattern: '^([A-D])[．\.]\s*(.*)$'
has_question_pattern: '\d+\s*[．\.]\s*[（(]\s*\d{4}\s*[·\.]'
topic_title_pattern: '专题\s*(\d+)\s+(\S+?)\s*$'

# 可选：行为配置
option_keys: [A, B, C, D]
essay_keywords:
  - 求
  - 证明
  - 试求
  - 试证明
  - 计算
  - "解:"
  - "解："
  - （1）
  - (1)
  - ①
  - ②
  - ③

skip_patterns:
  - '学科\s*网'
  - '股\s*份'
  - '有限公司'
  - '考点'
  - '命题趋势'

skip_exact_lines:
  - 考点
  - 命题趋势
  - 五年考情（2021-2025）
