# 通用宽松配置 —— 适配大多数中文题库 PDF
#
# 比学科网配置更宽松：
#   - 不要求年份+省份+高考真题的完整题号格式
#   - 不要求页眉有"专题XX / N"格式
#   - 任何"数字．(题干)"模式都识别为题目
#
# 适用：组卷网、试卷集、教辅资料、扫描后重新排版的 PDF

name: 通用宽松
description: 通用中文题库 PDF 解析配置（宽松模式）

# 题目识别：纯"数字．题干"或"数字、题干"
# 不强求年份/省份信息（很多题库没标）
question_pattern: '^(\d+)\s*[．\.、]\s*(.{10,})'
# 题目结束后下一个数字行就是下一题

# 选项识别：标准 A./B./C./D. 格式
option_pattern: '^([A-D])[．\.]\s*(.*)$'

# 不强求页眉——但保留识别（可选）
header_pattern: ''  # 空 = 不识别页眉
has_question_pattern: '^\d+\s*[．\.、]'

# 弱化专题识别：每题视为独立专题
topic_title_pattern: ''  # 不从页眉提取专题
option_keys: [A, B, C, D]

essay_keywords:
  - 求
  - 证明
  - 试求
  - 试证明
  - 计算
  - "解:"
  - "解："
  - （1）
  - (1)
  - ①
  - ②
  - ③

skip_patterns:
  - '学科\s*网'
  - '股\s*份'
  - '有限公司'
  - '考点'
  - '命题趋势'

skip_exact_lines: []
